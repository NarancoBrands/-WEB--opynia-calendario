<header class="app-header">
  <div class="header-container">
    <div class="header-left">
      <div class="logo-section">
        <div class="logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
        <div class="brand-info">
          <h1 class="brand-title">Calendario de Reservas</h1>
          <p class="brand-subtitle">Sistema de gestión inteligente</p>
        </div>
      </div>
    </div>

    <div class="header-right">
      <div class="header-actions">
        <!-- Estado de conexión con Google -->
        <div class="google-status" *ngIf="isGoogleConnected">
          <div class="status-indicator">
            <span class="status-dot"></span>
            <span class="status-text">Sincronización Activa</span>
          </div>
          <button 
            class="btn btn-disconnect" 
            (click)="onDisconnectFromGoogle()" 
            [disabled]="isLoading"
            title="Desconectar de Google y detener la sincronización">
            <svg *ngIf="!isLoading" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18M6 6l12 12"></path>
            </svg>
            <div *ngIf="isLoading" class="loading-spinner"></div>
            Desconectar
          </button>
        </div>

        <!-- Botón de conectar con Google -->
        <button 
          *ngIf="!isGoogleConnected" 
          class="btn btn-connect" 
          (click)="onConnectToGoogle()" 
          [disabled]="isLoading">
          <svg *ngIf="!isLoading" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <div *ngIf="isLoading" class="loading-spinner"></div>
          Conectar con Google
        </button>

        <!-- Botón de cerrar sesión -->
        <button 
          class="btn btn-logout" 
          (click)="onShowLogoutModal()"
          title="Cerrar sesión">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Cerrar Sesión
        </button>
      </div>
    </div>
  </div>
</header>
