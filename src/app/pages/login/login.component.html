<div class="card">
    <p id="title">Inicio de sesión</p>
    <form [formGroup]="loginForm">
        <div class="form-group">
            <label for="email">Email </label>
            <input type="email" id="email" class="form-control" formControlName="email" />
        </div>
        <div class="form-group">
            <label for="email">Contraseña </label>
            <input type="email" id="email" class="form-control" formControlName="password" />
        </div>
        <br/>
        <button type="submit" id="schedule-button" (click)="login()">Login</button>
    </form>


</div>
